<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Oxide mark on the app tile: an open ring with one atom slipping out of the gap.
       Source for `npx tauri icon`. Same geometry as src/components/OxideMark.tsx (32-unit grid, ×18). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9643a"/>
      <stop offset="1" stop-color="#94401f"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <g transform="translate(242 197) scale(18)" fill="none">
    <circle cx="15" cy="17" r="9" stroke="#fff6ef" stroke-width="4" stroke-linecap="round"
            stroke-dasharray="40.5 16.05" transform="rotate(6.4 15 17)"/>
    <circle cx="22.4" cy="9.6" r="2.6" fill="#fff6ef"/>
  </g>
</svg>
