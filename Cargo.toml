[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "1.0.4"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
authors = ["Oxide contributors"]

[workspace.dependencies]
# Internal crates
oxide-core = { path = "crates/oxide-core" }
oxide-store = { path = "crates/oxide-store" }
oxide-llm = { path = "crates/oxide-llm" }
oxide-mcp = { path = "crates/oxide-mcp" }
oxide-agent = { path = "crates/oxide-agent" }
oxide-bridge = { path = "crates/oxide-bridge" }
oxide-pyenv = { path = "crates/oxide-pyenv" }
oxide-sandbox = { path = "crates/oxide-sandbox" }
oxide-computer = { path = "crates/oxide-computer" }

# Shared external crates
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# Native TLS: SChannel on Windows, Security.framework on macOS, OpenSSL on Linux.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
keyring = "3"
tempfile = "3"
# Attachments: image resizing/compression and PDF text extraction (Phase 4).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
pdf-extract = "0.8"

# Typed IPC: tauri-specta, specta and specta-typescript are released together and stay
# pinned as a set (see PROGRESS.md, Phase 0).
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.dev]
incremental = true

# Screenshots for computer use are resized and JPEG-encoded on every action; unoptimized,
# that takes seconds per screenshot in dev builds and tests (Phase 16).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind (the default) rather than abort: third-party file parsers (pdf-extract) can panic on
# malformed input, and Oxide catches that instead of losing the whole app.
strip = true
