[package]
name = "oxide-computer"
description = "Screen capture and input control for computer use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
oxide-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
# Screen capture (Windows: DXGI/GDI, macOS: ScreenCaptureKit, Linux: X11/PipeWire).
xcap = "0.9"

# Computer use's input and window checks run on Windows only for now (Phase 16).
[target."cfg(windows)".dependencies]
enigo = "0.6.1"
uiautomation = "0.25.1"
# Same version as xcap's and uiautomation's (already in Cargo.lock).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
