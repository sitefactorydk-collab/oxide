[package]
name = "oxide-store"
description = "SQLite persistence for Oxide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
oxide-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid.workspace = true
sqlx.workspace = true

# Keys go to the OS credential store. keyring 3 needs a backend feature per OS; without one
# it silently falls back to an in-memory mock.
[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }

[features]
# Linux: keep keys in the Secret Service (GNOME Keyring, KWallet) over D-Bus, with the kernel
# keyring as the fallback (Phase 18). The app turns it on; it needs libdbus-1 (`libdbus-1-dev`
# to build). Off, Linux uses the kernel keyring only (the library crates' tests).
secret-service = ["keyring/sync-secret-service", "keyring/crypto-rust"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
