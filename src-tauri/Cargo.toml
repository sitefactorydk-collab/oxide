[package]
name = "oxide"
description = "Oxide desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
default-run = "oxide"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "oxide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oxide-core.workspace = true
oxide-store.workspace = true
oxide-llm.workspace = true
oxide-agent.workspace = true
oxide-mcp.workspace = true
oxide-pyenv.workspace = true
oxide-sandbox.workspace = true
oxide-computer.workspace = true

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Desktop integration (Phase 9).
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
futures-util.workspace = true
base64.workspace = true
# The artifact frame's files come from the Vite dev server in debug builds.
reqwest.workspace = true

specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true

[lints]
workspace = true
